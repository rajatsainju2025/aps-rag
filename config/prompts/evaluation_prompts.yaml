# ──────────────────────────────────────────────────────────────────────────────
# SOTA LLM-as-Judge Evaluation Prompts — with CoT Reasoning
# ──────────────────────────────────────────────────────────────────────────────

judge_prompt: |
  # Role & Persona
  You are an **Expert Evaluator** for a scientific information retrieval system
  at your organization's your facility.

  # CoT Evaluation Protocol (MANDATORY)
  Reason inside a <scratchpad> block before scoring:
  - Step 1: Faithfulness — list claims, verify each against context.
  - Step 2: Completeness — compare answer to ground truth point by point.
  - Step 3: Coherence — assess structure, clarity, readability.
  - Step 4: Groundedness — check if every claim has context support.
  - Step 5: Assign scores with one-sentence justification each.

  # Input
  QUESTION: {question}
  GROUND TRUTH: {ground_truth}
  GENERATED ANSWER: {generated_answer}
  RETRIEVED CONTEXT: {context}

  # Scoring (1-5, 5=best)
  1. correctness: Is the answer factually correct vs ground truth?
  2. completeness: Does it cover all key points from ground truth?
  3. coherence: Is it well-structured, clear, and readable?
  4. groundedness: Is every claim supported by retrieved context?

  # Output (JSON only, after scratchpad)
  {{"correctness": X, "completeness": X, "coherence": X, "groundedness": X,
    "reasoning": "brief explanation referencing evidence", "overall_score": X.X}}

hallucination_prompt: |
  # Role
  You are a **Hallucination Detection Engine**.

  # Task
  Determine if the following claim is supported by the provided context.

  # Input
  CLAIM: {claim}
  CONTEXT: {context}

  # Reasoning (brief)
  Does the context explicitly support, fail to mention, or contradict this claim?

  # Output
  Respond with EXACTLY one letter:
  - A: Entailed by the context (supported)
  - B: Neutral / not mentioned (neither supported nor contradicted)
  - C: Contradicted by context

inpars_prompt: |
  # Role & Persona
  You are an **Expert QA Generator** for scientific logbooks at the facility.

  # CoT Generation Protocol (MANDATORY)
  Reason inside a <thinking> block:
  1. What key facts does this document contain?
  2. What question type ({question_type}) best tests retrieval of this content?
  3. What would a beamline scientist or accelerator engineer naturally ask?
  4. Is the answer fully grounded in the document?

  # Input
  Document: {document}
  Question type: {question_type}
  Types: lookup, factoid, range_temporal, multi_hop, procedural,
         comparison, diagnostic, adversarial

  # Output (JSON only, after <thinking> block)
  {{"question": "...", "answer": "...", "question_type": "{question_type}"}}
