# Local development stack for APS-RAG.
#
#   docker compose -f infrastructure/docker-compose.yml up -d
#
# Brings up the two stores ingestion always needs (Qdrant + Elasticsearch) and,
# optionally, Neo4j for the knowledge graph. Ports match config/config.example.yaml.
#
# NOTE: this is a DEV configuration — Elasticsearch security is disabled and
# passwords are placeholders. Do NOT use as-is in production.
services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: aps_rag_qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: aps_rag_elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"     # DEV ONLY — enable + set creds in production
      ES_JAVA_OPTS: "-Xms1g -Xmx1g"
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10

  # Optional — only needed for the knowledge graph (scripts/build_kg.py / --build-kg).
  neo4j:
    image: neo4j:5.18
    container_name: aps_rag_neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:-change-me}"
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
    volumes:
      - neo4j_data:/data
    restart: unless-stopped

volumes:
  qdrant_data:
  es_data:
  neo4j_data:
